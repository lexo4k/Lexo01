name: NEXORA Continuous Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [lumen-ai-core]
    paths:
      - "lumen-ai-core/**"
      - ".github/workflows/nexora-maintenance.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: nexora-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate core before deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen-ai-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lumen-ai-core/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
