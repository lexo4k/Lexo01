name: LÚMEN Android APK

on:
  push:
    branches: ["lumen-ai-core"]
    paths:
      - "lumen-android/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/lumen-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lumen:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LÚMEN source and required Gradle submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build only the LÚMEN Android app
        run: gradle --no-daemon :lumen:assembleDebug

      - name: Upload LÚMEN APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-AI-debug
          path: lumen-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
