name: AURION Android APK

on:
  push:
    branches: ["lumen-ai-core"]
    paths:
      - "lumen-android/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/lumen-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lumen:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout AURION source
        uses: actions/checkout@v4

      - name: Set up Python for regression tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AURION core dependencies
        run: python -m pip install -r lumen-ai-core/requirements.txt

      - name: Verify AURION core and Android interface contract
        run: PYTHONPATH=lumen-ai-core python -m unittest discover -s lumen-ai-core/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build only the AURION Android app
        working-directory: lumen-android
        run: gradle --no-daemon assembleDebug

      - name: Verify generated APK archive
        working-directory: lumen-android
        shell: bash
        run: |
          apk="$(find build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -Eq 'classes[0-9]*\\.dex'

      - name: Upload AURION APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurion-AI-debug
          path: lumen-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
