name: LÚMEN Core Tests

on:
  push:
    branches: ["lumen-ai-core"]
    paths:
      - "lumen-ai-core/**"
      - ".github/workflows/lumen-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r lumen-ai-core/requirements.txt
      - name: Run backend and interface contract tests
        run: python -m unittest discover -s lumen-ai-core/tests -v
