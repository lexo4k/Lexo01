name: AURION Core Tests

on:
  push:
    branches: ["lumen-ai-core"]
    paths:
      - "lumen-ai-core/**"
      - "lumen-android/src/main/assets/index.html"
      - "lumen-android/src/main/java/com/lexo/lumen/MainActivity.kt"
      - "lumen-android/src/main/java/com/lexo/lumen/MinecraftRelayClient.kt"
      - ".github/workflows/lumen-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r lumen-ai-core/requirements.txt
      - name: Run backend and interface contract tests
        run: PYTHONPATH=lumen-ai-core python -m unittest discover -s lumen-ai-core/tests -v
      - name: Validate AURION interface JavaScript and Android asset mirror
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          web = Path("lumen-ai-core/index.html").read_text(encoding="utf-8")
          android = Path("lumen-android/src/main/assets/index.html").read_text(encoding="utf-8")
          if web != android:
              raise SystemExit("AURION web interface and Android asset are out of sync.")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", web, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No application JavaScript block found.")
          Path("/tmp/aurion-ui.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Validated mirror and extracted {len(scripts)} script block(s).")
          PY
          node --check /tmp/aurion-ui.js
