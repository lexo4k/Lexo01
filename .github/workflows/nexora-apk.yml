name: NEXORA AI on-device APK

on:
  push:
    branches: ["lumen-ai-core"]
    paths:
      - "lumen-android/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - ".github/workflows/nexora-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nexora:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build NEXORA AI only
        run: gradle --no-daemon :lumen:assembleDebug

      - name: Verify APK contents
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path

          apk = Path("lumen-android/build/outputs/apk/debug/lumen-android-debug.apk")
          if not apk.is_file():
              raise SystemExit(f"APK não encontrado: {apk}")

          with ZipFile(apk) as z:
              names = z.namelist()
              native = [n for n in names if n.endswith("/libllama_jni.so")]
              if not native:
                  raise SystemExit("Runtime nativo llama.cpp não encontrado no APK")
              html_paths = [n for n in names if n.endswith("assets/index.html")]
              if not html_paths:
                  raise SystemExit("Interface assets/index.html não encontrada no APK")
              html = z.read(html_paths[0]).decode("utf-8", errors="replace")
              for marker in ("Baixar e ativar IA local", "sendLocalMessage", "downloadLocalModel"):
                  if marker not in html:
                      raise SystemExit(f"Recurso ausente no HTML empacotado: {marker}")
              print("APK verificado:", apk.stat().st_size, "bytes")
              print("Runtime nativo:", ", ".join(native))
              print("Interface:", html_paths[0])
              print("Ponte Android/JavaScript e botão de download encontrados.")
          PY

      - name: Upload NEXORA AI APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-on-device-debug
          path: lumen-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
