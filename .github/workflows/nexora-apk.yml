name: NEXORA AI on-device APK

on:
  push:
    branches: ["lumen-ai-core"]
    paths:
      - "lumen-android/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - ".github/workflows/nexora-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nexora:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build NEXORA AI only
        run: gradle --no-daemon :lumen:assembleDebug

      - name: Verify local inference runtime is packaged
        run: |
          APK="lumen-android/build/outputs/apk/debug/lumen-android-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "libllama_jni.so"
          unzip -p "$APK" assets/index.html | grep -q "Baixar e ativar IA local"
          unzip -p "$APK" assets/index.html | grep -q "sendLocalMessage"

      - name: Upload NEXORA AI APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-on-device-debug
          path: lumen-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
