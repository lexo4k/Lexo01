name: Build TTK BOOST APK
on:
  push:
    paths:
      - 'ttk-boost-android/**'
      - '.github/workflows/ttk-boost-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ttk-boost-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ttk-boost-debug-apk
          path: ttk-boost-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
