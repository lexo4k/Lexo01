name: MemDroid Android build

on:
  push:
    branches:
      - memdroid-0.1.0
    paths:
      - 'MemDroid/**'
      - '.github/workflows/memdroid-build.yml'
  pull_request:
    paths:
      - 'MemDroid/**'
      - '.github/workflows/memdroid-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.7/bin >> "$GITHUB_PATH"
          gradle --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile debug APK
        working-directory: MemDroid
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: test -s MemDroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MemDroid-debug-apk
          path: MemDroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
