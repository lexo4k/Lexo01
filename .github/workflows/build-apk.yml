name: Build Android APKs

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      AutoReleaseBuildRust: "1"
    steps:
      - name: Checkout repository and original Mamu submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms, build tools and NDK
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Localize Mamu interface to Brazilian Portuguese
        run: python3 scripts/localize_mamu_pt.py

      - name: Build Android Resource Lab and localized Mamu module
        run: gradle --no-daemon clean assembleDebug

      - name: Show generated APKs
        if: always()
        run: find . -type f -path "*/build/outputs/apk/*/*.apk" -print

      - name: Upload Android Resource Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidResourceLab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload original Mamu APK when generated
        uses: actions/upload-artifact@v4
        with:
          name: Mamu-original-debug
          path: |
            vendor/Mamu/app/build/outputs/apk/debug/*.apk
            mamu/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
